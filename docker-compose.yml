
services:
  mysql:
    image: mysql:8.0
    container_name: biblioteca_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: biblioteca_db
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - biblioteca_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: base64:lPY2WET2HfkyTkT8hyDm/KgtqJom48eKsLJXZuA1Hvs=
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: biblioteca_db
      DB_USERNAME: biblioteca
      DB_PASSWORD: biblioteca123
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - biblioteca_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biblioteca_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - biblioteca_net

volumes:
  mysql_data:

networks:
  biblioteca_net:
    driver: bridge